name: Cross-Repo System Test

on:
  # The API's top-level ref selects both this workflow and the test code.
  workflow_dispatch:
    inputs:
      suite:
        description: "E2E suite to run"
        type: choice
        options: [all, dpas, redsys, plugins]
        default: all
      repository_A:
        description: "Proxy repository (owner/repo)"
        type: string
        required: true
      branch_A:
        description: "Proxy branch"
        type: string
        default: master
      repository_B:
        description: "Charging repository (owner/repo)"
        type: string
        required: true
      branch_B:
        description: "Charging branch"
        type: string
        default: master
      repository_frontend:
        description: "Frontend repository (owner/repo)"
        type: string
        required: true
      branch_frontend:
        description: "Frontend branch"
        type: string
        default: master
      tm_version:
        description: "TMForum API image version"
        type: string
        required: true
      pull_request_url:
        description: "Optional source PR URL for commit status reporting"
        type: string
      from:
        description: "Source integration (charging selects the FIWARE_ADMIN status token)"
        type: string
  repository_dispatch:
    types:
      - cross-repo-test

jobs:
  run-system-tests:
    name: E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON((inputs.suite || github.event.client_payload.suite) == 'dpas' && '["dpas"]' || (inputs.suite || github.event.client_payload.suite) == 'redsys' && '["redsys"]' || (inputs.suite || github.event.client_payload.suite) == 'plugins' && '["plugins"]' || '["dpas","redsys","plugins"]') }}
    env:
      E2E_SUITE: ${{ matrix.suite }}
      BAE_CB_PAYMENT_METHOD: ${{ matrix.suite == 'redsys' && 'redsys' || 'dpas' }}
      GH_TOKEN: ${{ (inputs.from || github.event.client_payload.from) == 'charging' && secrets.FIWARE_ADMIN || secrets.ADMIN }}
      PROXY_REPO: ${{ inputs.repository_A || github.event.client_payload.repository_A }}
      BRANCH_A: ${{ inputs.branch_A || github.event.client_payload.branch_A || 'master' }}
      CHARGING_REPO: ${{ inputs.repository_B || github.event.client_payload.repository_B }}
      BRANCH_B: ${{ inputs.branch_B || github.event.client_payload.branch_B || 'master' }}
      FRONTEND_REPO: ${{ inputs.repository_frontend || github.event.client_payload.repository_frontend }}
      BRANCH_FRONTEND: ${{ inputs.branch_frontend || github.event.client_payload.branch_frontend || 'master' }}
      TM_VERSION: ${{ inputs.tm_version || github.event.client_payload.tm_version }}
      PR_URL: ${{ inputs.pull_request_url || github.event.client_payload.pull_request_url }}

    steps:
      - name: Checkout Testing Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pin manual runs to the commit selected by the dispatch ref.
          # Legacy dispatch can still select test code only via cypress_branch.
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.cypress_branch || github.sha }}

      - name: Create commit status - pending
        if: env.PR_URL != ''
        run: |
          REPO=$(echo "$PR_URL" | sed -E 's|https://github.com/([^/]+/[^/]+)/pull/.*|\1|')
          PR_NUMBER=$(echo "$PR_URL" | sed -E 's|.*/pull/([0-9]+).*|\1|')

          echo "Fetching PR SHA for repo: $REPO, PR: $PR_NUMBER"
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/$REPO/pulls/$PR_NUMBER | jq -r '.head.sha')

          echo "Creating pending status for SHA: $SHA"
          curl -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/$REPO/statuses/$SHA \
            -d "{
              \"state\": \"pending\",
              \"target_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"description\": \"E2E system tests running...\",
              \"context\": \"E2E System Tests (${{ matrix.suite }})\"
            }"

      - name: System testing (build + execution)
        env:
          GIT_TOKEN: "" #${{ secrets.PAT_TEST }}
        run: |
          chmod +x testing-local.sh
          echo "starting system testing"
          echo "final proxy branch: $BRANCH_A"
          echo "final charging branch: $BRANCH_B"
          echo "final frontend branch: $BRANCH_FRONTEND"

          ./testing-local.sh "$BRANCH_A" "$PROXY_REPO" "$BRANCH_B" "$CHARGING_REPO" "$BRANCH_FRONTEND" "$FRONTEND_REPO" "$TM_VERSION"

      - name: Upload Docker Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs-${{ matrix.suite }}
          path: docker-logs
          retention-days: 7

      - name: Upload Cypress Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.suite }}
          path: cypress/screenshots
          retention-days: 7

      - name: Upload Cypress Videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ matrix.suite }}
          path: cypress/videos
          retention-days: 1

      - name: Create commit status - success
        if: success() && env.PR_URL != ''
        run: |
          REPO=$(echo "$PR_URL" | sed -E 's|https://github.com/([^/]+/[^/]+)/pull/.*|\1|')
          PR_NUMBER=$(echo "$PR_URL" | sed -E 's|.*/pull/([0-9]+).*|\1|')

          echo "Fetching PR SHA for repo: $REPO, PR: $PR_NUMBER"
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/$REPO/pulls/$PR_NUMBER | jq -r '.head.sha')

          echo "Creating success status for SHA: $SHA"
          curl -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/$REPO/statuses/$SHA \
            -d "{
              \"state\": \"success\",
              \"target_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"description\": \"E2E system tests passed\",
              \"context\": \"E2E System Tests (${{ matrix.suite }})\"
            }"

      - name: Create commit status - failure
        if: failure() && env.PR_URL != ''
        run: |
          REPO=$(echo "$PR_URL" | sed -E 's|https://github.com/([^/]+/[^/]+)/pull/.*|\1|')
          PR_NUMBER=$(echo "$PR_URL" | sed -E 's|.*/pull/([0-9]+).*|\1|')

          echo "Fetching PR SHA for repo: $REPO, PR: $PR_NUMBER"
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/$REPO/pulls/$PR_NUMBER | jq -r '.head.sha')

          echo "Creating failure status for SHA: $SHA"
          curl -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/$REPO/statuses/$SHA \
            -d "{
              \"state\": \"failure\",
              \"target_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"description\": \"E2E system tests failed\",
              \"context\": \"E2E System Tests (${{ matrix.suite }})\"
            }"
