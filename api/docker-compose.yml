    image: docker.io/drllbl18/tmforum-customer-management:${TM_VERSION:-sbx_1.8.4}
    environment:
      <<: *tmf-environment
      GENERAL_BASEPATH: /tmf-api/customerManagement/v4

  product-catalog:
