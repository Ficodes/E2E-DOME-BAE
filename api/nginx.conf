server {
    listen 8080;
    client_max_body_size 15m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";

    location /tmf-api/party/v4 {
        proxy_pass http://party-catalog:8080;
    }

    location /tmf-api/customerBillManagement/v4 {
        proxy_pass http://customer-bill-management:8080;
    }

    location /tmf-api/customerManagement/v4 {
        proxy_pass http://customer-management:8080;
    }

    location /tmf-api/productCatalogManagement/v4 {
        proxy_pass http://product-catalog:8080;
    }

    location /tmf-api/productInventory/v4 {
        proxy_pass http://product-inventory:8080;
    }

    location /tmf-api/productOrderingManagement/v4 {
        proxy_pass http://product-ordering-management:8080;
    }

    location /tmf-api/resourceCatalog/v4 {
        proxy_pass http://resource-catalog:8080;
    }

    location /tmf-api/resourceFunctionActivation/v4 {
        proxy_pass http://resource-function-activation:8080;
    }

    location /tmf-api/resourceInventoryManagement/v4 {
        proxy_pass http://resource-inventory:8080;
    }

    location /tmf-api/serviceCatalogManagement/v4 {
        proxy_pass http://service-catalog:8080;
    }

    location /tmf-api/serviceInventory/v4 {
        proxy_pass http://service-inventory:8080;
    }

    location /tmf-api/accountManagement/v4 {
        proxy_pass http://account:8080;
    }

    location /tmf-api/agreementManagement/v4 {
        proxy_pass http://agreement:8080;
    }

    location /tmf-api/usageManagement/v4 {
        proxy_pass http://usage-management:8080;
    }

    location /tmf-api/quoteManagement/v4 {
        proxy_pass http://quote:8080;
    }

    location /tmf-api/document/v4 {
        proxy_pass http://document-management:8080;
    }

    # The existing BAE clients use this alias for PRD's quoteManagement API.
    location /tmf-api/quote/v4 {
        rewrite ^/tmf-api/quote/v4(.*)$ /tmf-api/quoteManagement/v4$1 break;
        proxy_pass http://quote:8080;
    }

    location / {
        return 404;
    }
}
